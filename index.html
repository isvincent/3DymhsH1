    // =========================================================================
    // 2. 全域狀態與篩選管理
    // =========================================================================
    let filteredData = [...HISTORY_DATA];
    let currentIndex = 0;
    let currentCategory = 'all';
    let isAutoPlaying = false;
    let autoPlayTimer = null;

    // 更新全部按鈕數量
    document.querySelector('[data-cat="all"]').textContent = `全部 (${HISTORY_DATA.length})`;

    // =========================================================================
    // 3. Three.js 3D 螺旋時光隧道場景建構
    // =========================================================================
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070b19, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x070b19, 1);

    // 燈光配置
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xf43f5e, 2.5, 120);
    pointLight1.position.set(10, 15, 10);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x38bdf8, 2, 120);
    pointLight2.position.set(-15, -10, -40);
    scene.add(pointLight2);

    // 3D 節點群組與軌道線群組
    const nodesGroup = new THREE.Group();
    scene.add(nodesGroup);

    let nodeMeshes = [];
    let pathCurve = null;
    let tubeMesh = null;

    // 產生年份文字 Sprite 貼圖
    function createLabelSprite(yearText, titleText, hexColor) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      // 半透明背板
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = hexColor;
      ctx.lineWidth = 6;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(16, 24, 480, 190, 28);
      } else {
        ctx.rect(16, 24, 480, 190);
      }
      ctx.fill();
      ctx.stroke();

      // 年份大字
      ctx.fillStyle = hexColor;
      ctx.font = '900 64px "Noto Serif TC", serif';
      ctx.textAlign = 'center';
      ctx.fillText(yearText, 256, 105);

      // 標題小字 (截斷保護)
      ctx.fillStyle = '#f8fafc';
      ctx.font = '600 30px "Noto Sans TC", sans-serif';
      const shortTitle = titleText.length > 13 ? titleText.slice(0, 13) + '…' : titleText;
      ctx.fillText(shortTitle, 256, 168);

      const texture = new THREE.CanvasTexture(c);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(7.5, 3.75, 1);
      return sprite;
    }

    // 依據目前篩選的資料建立 3D 節點與發光軌道
    function build3DTimeline() {
      // 清除舊物件
      while (nodesGroup.children.length > 0) {
        nodesGroup.remove(nodesGroup.children[0]);
      }
      if (tubeMesh) {
        scene.remove(tubeMesh);
        tubeMesh.geometry.dispose();
        tubeMesh.material.dispose();
      }
      nodeMeshes = [];

      const curvePoints = [];
      const spacingZ = 18; // 每個節點的 Z 軸距離

      filteredData.forEach((item, idx) => {
        // 螺旋曲線座標計算
        const angle = idx * 0.55;
        const radius = 6.5;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * (radius * 0.65);
        const z = -idx * spacingZ;

        const pos = new THREE.Vector3(x, y, z);
        curvePoints.push(pos);

        // 依類別決定 3D 幾何體形狀
        let geom;
        if (item.category === 'milestone') {
          geom = new THREE.OctahedronGeometry(1.45, 0); // 精神堡壘八面晶體
        } else if (item.category === 'campus') {
          geom = new THREE.BoxGeometry(1.8, 1.8, 1.8); // 建築方塊
        } else if (item.category === 'memory') {
          geom = new THREE.TorusKnotGeometry(0.95, 0.28, 64, 12); // 梅岡記憶流線結
        } else {
          geom = new THREE.IcosahedronGeometry(1.35, 0); // 榮耀寶石二十面體
        }

        const mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(item.color),
          emissive: new THREE.Color(item.color),
          emissiveIntensity: 0.35,
          roughness: 0.2,
          metalness: 0.7
        });

        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.copy(pos);
        mesh.userData = { index: idx, item };

        // 外圍光環
        const ringGeom = new THREE.RingGeometry(1.8, 2.05, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(item.color),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.5
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        mesh.add(ring);

        // 懸浮文字看板
        const label = createLabelSprite(String(item.year), item.title, item.color);
        label.position.set(0, 2.9, 0);
        mesh.add(label);

        nodesGroup.add(mesh);
        nodeMeshes.push(mesh);
      });

      // 建立貫穿所有節點的光軌曲線
      if (curvePoints.length >= 2) {
        pathCurve = new THREE.CatmullRomCurve3(curvePoints);
        const tubeGeom = new THREE.TubeGeometry(pathCurve, filteredData.length * 12, 0.12, 8, false);
        const tubeMat = new THREE.MeshBasicMaterial({
          color: 0xf472b6,
          transparent: true,
          opacity: 0.35
        });
        tubeMesh = new THREE.Mesh(tubeGeom, tubeMat);
        scene.add(tubeMesh);
      }

      // 更新滑桿最大值
      const slider = document.getElementById('timeline-slider');
      slider.max = Math.max(0, filteredData.length - 1);
      slider.value = 0;
    }

    // 漫天梅花星塵粒子系統
    const particleCount = 1200;
    const particleGeom = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const palette = [
      new THREE.Color('#f43f5e'),
      new THREE.Color('#f472b6'),
      new THREE.Color('#fbbf24'),
      new THREE.Color('#38bdf8')
    ];

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 90;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 90;
      positions[i * 3 + 2] = -Math.random() * 750 + 30;

      const c = palette[Math.floor(Math.random() * palette.length)];
      colors[i * 3] = c.r;
      colors[i * 3 + 1] = c.g;
      colors[i * 3 + 2] = c.b;
    }

    particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.45,
      vertexColors: true,
      transparent: true,
      opacity: 0.75
    });
    const starField = new THREE.Points(particleGeom, particleMat);
    scene.add(starField);

    // =========================================================================
    // 4. 鏡頭飛行與 UI 同步邏輯
    // =========================================================================
    function focusNode(index, immediate = false) {
      if (filteredData.length === 0) return;
      currentIndex = Math.max(0, Math.min(index, filteredData.length - 1));

      const targetMesh = nodeMeshes[currentIndex];
      const item = filteredData[currentIndex];
      if (!targetMesh || !item) return;

      // 桌機與手機鏡頭偏移最佳化 (讓左側資訊卡不遮擋 3D 節點)
      const isMobile = window.innerWidth < 768;
      const offsetX = isMobile ? 0 : -3.2;
      const offsetY = isMobile ? -1.8 : 0.6;
      const offsetZ = isMobile ? 11.5 : 9.5;

      const targetCamPos = {
        x: targetMesh.position.x + offsetX,
        y: targetMesh.position.y + offsetY,
        z: targetMesh.position.z + offsetZ
      };

      // 高亮當前節點
      nodeMeshes.forEach((m, idx) => {
        const isCurrent = idx === currentIndex;
        gsap.to(m.scale, {
          x: isCurrent ? 1.35 : 0.85,
          y: isCurrent ? 1.35 : 0.85,
          z: isCurrent ? 1.35 : 0.85,
          duration: 0.6
        });
        m.material.emissiveIntensity = isCurrent ? 0.85 : 0.25;
      });

      // 鏡頭平滑飛行
      if (immediate) {
        camera.position.set(targetCamPos.x, targetCamPos.y, targetCamPos.z);
      } else {
        gsap.to(camera.position, {
          x: targetCamPos.x,
          y: targetCamPos.y,
          z: targetCamPos.z,
          duration: 1.1,
          ease: "power3.out"
        });
      }

      // 移動動態光源跟隨鏡頭
      pointLight1.position.set(targetCamPos.x + 8, targetCamPos.y + 8, targetCamPos.z + 5);

      // 更新 UI 卡片
      updateCardUI(item, currentIndex);

      // 同步底部滑桿
      document.getElementById('timeline-slider').value = currentIndex;
    }

    function updateCardUI(item, index) {
      document.getElementById('card-year').textContent = item.year;
      document.getElementById('card-roc').textContent = `(${item.roc})`;
      document.getElementById('card-title').textContent = item.title;
      document.getElementById('card-index').textContent = index + 1;
      document.getElementById('card-total').textContent = filteredData.length;

      const badge = document.getElementById('card-badge');
      badge.textContent = item.catName;
      badge.style.borderColor = item.color;
      badge.style.color = item.color;

      const pointsList = document.getElementById('card-points');
      pointsList.innerHTML = item.points
        .map(p => `<li class="leading-relaxed">${p}</li>`)
        .join('');

      const quoteBox = document.getElementById('card-quote-box');
      if (item.quote) {
        quoteBox.classList.remove('hidden');
        document.getElementById('card-quote').textContent = item.quote;
        document.getElementById('card-quote-author').textContent = item.quoteAuthor || '';
      } else {
        quoteBox.classList.add('hidden');
      }
    }

    // =========================================================================
    // 5. 互動控制：前後站、分類篩選、自動導覽、3D 點擊與手勢
    // =========================================================================
    function navigateStep(delta) {
      const next = currentIndex + delta;
      if (next >= 0 && next < filteredData.length) {
        focusNode(next);
      } else if (isAutoPlaying && next >= filteredData.length) {
        focusNode(0); // 自動導覽循環回到起點
      }
    }

    function onSliderInput(val) {
      focusNode(parseInt(val, 10));
    }

    function filterCategory(cat) {
      currentCategory = cat;
      if (cat === 'all') {
        filteredData = [...HISTORY_DATA];
      } else {
        filteredData = HISTORY_DATA.filter(d => d.category === cat);
      }

      // 更新按鈕樣式
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.classList.add('bg-pink-600', 'text-white');
          btn.classList.remove('glass-panel', 'text-slate-200');
        } else {
          btn.classList.remove('bg-pink-600', 'text-white');
          btn.classList.add('glass-panel', 'text-slate-200');
        }
      });

      build3DTimeline();
      focusNode(0, true);
    }

    function jumpToYear(year) {
      if (currentCategory !== 'all') filterCategory('all');
      const idx = filteredData.findIndex(d => d.year === year);
      if (idx !== -1) focusNode(idx);
    }

    function jumpToId(id) {
      if (currentCategory !== 'all') filterCategory('all');
      const idx = filteredData.findIndex(d => d.id === id);
      if (idx !== -1) focusNode(idx);
    }

    function toggleAutoPlay() {
      isAutoPlaying = !isAutoPlaying;
      const btn = document.getElementById('autoplay-btn');
      if (isAutoPlaying) {
        btn.textContent = '⏸ 暫停導覽';
        btn.classList.add('glow-btn');
        autoPlayTimer = setInterval(() => navigateStep(1), 4500);
      } else {
        btn.textContent = '▶ 自動導覽';
        btn.classList.remove('glow-btn');
        clearInterval(autoPlayTimer);
      }
    }

    // 總覽搜尋 Modal
    function toggleModal(id) {
      const el = document.getElementById(id);
      el.classList.toggle('hidden');
      if (!el.classList.contains('hidden')) {
        renderModalList(document.getElementById('search-input').value);
      }
    }

    function renderModalList(keyword = '') {
      const container = document.getElementById('modal-list');
      const kw = keyword.trim().toLowerCase();
      const matches = HISTORY_DATA.filter(item => {
        const fullText = `${item.year} ${item.roc} ${item.title} ${item.points.join(' ')} ${item.quote || ''}`.toLowerCase();
        return fullText.includes(kw);
      });

      if (matches.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm col-span-2 text-center py-8">找不到符合「${keyword}」的校史紀錄</p>`;
        return;
      }

      container.innerHTML = matches.map(item => `
        <div onclick="selectFromModal('${item.id}')" class="p-3.5 rounded-2xl bg-slate-900/75 hover:bg-pink-500/20 border border-slate-800 hover:border-pink-500/50 cursor-pointer transition flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="serif-title font-bold text-lg text-pink-400">${item.year} <small class="text-xs text-slate-400 font-normal">(${item.roc})</small></span>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">${item.catName}</span>
            </div>
            <h4 class="font-bold text-sm text-white mb-1.5">${item.title}</h4>
            <p class="text-xs text-slate-300 line-clamp-2">${item.points[0]}</p>
          </div>
          <div class="text-right mt-2">
            <span class="text-[11px] text-pink-400 font-medium">點擊飛往該站 →</span>
          </div>
        </div>
      `).join('');
    }

    function selectFromModal(id) {
      toggleModal('search-modal');
      jumpToId(id);
    }

    // 滑鼠滾輪與鍵盤事件
    let wheelTimeout = false;
    window.addEventListener('wheel', (e) => {
      // 若在卡片內部或 Modal 內捲動文字，不觸發 3D 飛行
      if (e.target.closest('#info-card') || e.target.closest('#search-modal')) return;
      if (wheelTimeout) return;
      wheelTimeout = true;
      if (e.deltaY > 15) navigateStep(1);
      else if (e.deltaY < -15) navigateStep(-1);
      setTimeout(() => { wheelTimeout = false; }, 420);
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (!document.getElementById('search-modal').classList.contains('hidden')) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') navigateStep(1);
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') navigateStep(-1);
    });

    // 手機觸控滑動漫遊 (排除卡片內捲動)
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#info-card') || e.target.closest('#search-modal') || e.target.closest('header') || e.target.closest('footer')) return;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (!touchStartY) return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(deltaY) > 45) {
        if (deltaY > 0) navigateStep(1);
        else navigateStep(-1);
      }
      touchStartY = 0;
    }, { passive: true });

    // Raycaster 點擊 3D 節點直接跳轉
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    canvas.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeMeshes, false);
      if (intersects.length > 0) {
        const hitIndex = intersects[0].object.userData.index;
        if (typeof hitIndex === 'number') {
          focusNode(hitIndex);
        }
      }
    });

    // 視窗尺寸變更 RWD 處理
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      focusNode(currentIndex, true);
    });

    // =========================================================================
    // 6. 動畫主迴圈
    // =========================================================================
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // 節點自轉與懸浮呼吸感
      nodeMeshes.forEach((mesh, idx) => {
        mesh.rotation.y = elapsed * 0.6 + idx;
        mesh.rotation.x = Math.sin(elapsed * 0.5 + idx) * 0.25;
      });

      // 星塵緩慢漂浮
      starField.rotation.z = elapsed * 0.015;

      renderer.render(scene, camera);
    }

    // 初始化啟動
    build3DTimeline();
    focusNode(0, true);
    animate();

    // =========================================================================
    // 7. PWA Service Worker 註冊與安裝提示
    // =========================================================================
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-install-btn').classList.remove('hidden');
    });

    async function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('pwa-install-btn').classList.add('hidden');
      }
      deferredPrompt = null;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('Service Worker 註冊失敗:', err);
        });
      });
    }
  </script>
</body>
</html>
