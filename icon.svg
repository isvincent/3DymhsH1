<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="plum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- 背景圓角方塊 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <!-- 梅花五瓣造型 -->
  <g transform="translate(256, 230)">
    <circle cx="0" cy="-95" r="62" fill="url(#plum)" opacity="0.92" />
    <circle cx="90" cy="-29" r="62" fill="url(#plum)" opacity="0.92" />
    <circle cx="56" cy="77" r="62" fill="url(#plum)" opacity="0.92" />
    <circle cx="-56" cy="77" r="62" fill="url(#plum)" opacity="0.92" />
    <circle cx="-90" cy="-29" r="62" fill="url(#plum)" opacity="0.92" />
    <circle cx="0" cy="0" r="36" fill="#fbbf24" />
  </g>
  <!-- 底部文字 -->
  <text x="256" y="445" font-family="serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">梅岡</text>
</svg>
